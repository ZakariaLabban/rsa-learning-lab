name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retained interface regression checks (unpublished build)
        run: |
          npm run build -- --mode backup-test --outDir dist-backups
          npm run test:browser -- --config playwright.backups.config.ts
      - name: Mocked Supabase account flows
        env:
          VITE_SUPABASE_URL: https://rsa-lab-account-test.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: mock-publishable-key
          VITE_PRIVACY_CONTACT_EMAIL: privacy@example.test
          RSA_MOCK_AUTH: "1"
        run: |
          npm run build
          npm run test:browser -- account.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            frontend/test-results-backups
  python:
    name: Python reference and API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m reference.generate_vectors --check
      - run: python -m reference.generate_encoding_vectors --check
      - run: python -m reference.check_ts_outputs
  database:
    name: Supabase schema and RLS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
